<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My GitHub Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      animation: fadeIn 1s ease forwards;
    }

    .badge {
      display: inline-block;
      background: #238636;
      color: #fff;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    h1 span {
      color: #58a6ff;
    }

    p {
      color: #8b949e;
      font-size: 1rem;
      max-width: 420px;
      line-height: 1.7;
      margin: 0 auto 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      text-decoration: none;
      font-size: 0.9rem;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .btn:hover {
      background: #21262d;
      border-color: #58a6ff;
    }

    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(#30363d22 1px, transparent 1px),
        linear-gradient(90deg, #30363d22 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="container">
    <div class="badge">🚀 Live on GitHub Pages</div>
    <h1>Hello, <span>World.</span></h1>
    <p>This is a dummy page hosted on GitHub Pages. Replace this content with your own project.</p>
    <a class="btn" href="https://github.com" target="_blank">View on GitHub →</a>
  </div>
</body>
</html>
